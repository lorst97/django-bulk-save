[project]
name = "django-bulk-save"
version = "0.1.0"
description = "An efficiency utility for Django that combines custom per-instance save logic with bulk database updates."
readme = "README.md"
authors = [
    { email = "lorenzostefani003@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
   "asgiref>=3.12.1",
   "Django>=6.1.2",
   "django-pgbulk>=3.3,<4",
   "psycopg[binary]>=3.2,<4",
   "sqlparse>=0.6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0",
    "pytest-django>=4.12",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
